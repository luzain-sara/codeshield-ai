[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "codeshield"
version = "0.1.0"
description = "Local-first credential detection, verification and approved remediation CLI"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Luzain Sara"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic==2.12.5", "regex==2025.11.3", "tree-sitter==0.26.0", "tree-sitter-javascript==0.25.0"]

[project.urls]
Repository = "https://github.com/luzain-sara/codeshield-ai"
Documentation = "https://github.com/luzain-sara/codeshield-ai#readme"
Issues = "https://github.com/luzain-sara/codeshield-ai/issues"

[project.optional-dependencies]
dev = ["pytest==9.2.0", "PyYAML==6.0.3"]
gemini = ["google-genai==2.34.0", "python-dotenv==1.2.4"]

[project.scripts]
codeshield = "codeshield.cli:main"
codeshield-hook = "codeshield.integrations:hook_main"
codeshield-ci = "codeshield.integrations:ci_main"
codeshield-docker = "codeshield.integrations:docker_main"

[tool.setuptools.packages.find]
include = ["codeshield*"]

[tool.setuptools]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
