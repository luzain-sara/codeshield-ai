name: CodeShield security gate
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  security:
    if: github.event_name != 'push' || github.event.deleted != true
    runs-on: ubuntu-24.04
    env:
      CI: 'true'
      CODESHIELD_AUTOMATED: '1'
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Install hash-verified offline scanner
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          python -m pip install --no-build-isolation --no-deps .
          python -m pip check
      - name: Scan event comparison without live providers
        id: scan
        continue-on-error: true
        run: python -I -m codeshield.integrations ci --output "$RUNNER_TEMP/codeshield-report.json"
      - name: Upload redacted report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codeshield-report
          path: ${{ runner.temp }}/codeshield-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce gate result
        if: always() && steps.scan.outcome != 'success'
        run: exit 1
